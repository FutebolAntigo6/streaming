<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Estatísticas do Cristiano Ronaldo</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #0A1931, #6A0572);
      color: #222;
      padding: 40px 20px;
    }

    .card {
      background-color: #ffffff;
      border-radius: 15px;
      max-width: 750px;
      margin: 0 auto;
      padding: 35px 40px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    }

    h1 {
      text-align: center;
      color: #6A0572;
      font-size: 28px;
      margin-bottom: 30px;
    }

    h2 {
      color: #0A1931;
      border-left: 6px solid #6A0572;
      padding-left: 10px;
      margin-top: 35px;
      font-size: 22px;
    }

    p {
      margin: 8px 0;
      font-size: 16px;
    }

    .jogo {
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 1px solid #ddd;
    }

    strong {
      color: #333;
    }

    @media (max-width: 600px) {
      .card {
        padding: 25px 20px;
      }

      h1 {
        font-size: 24px;
      }

      h2 {
        font-size: 20px;
      }

      p {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Estatísticas do Cristiano Ronaldo</h1>
    <div id="ultimoGol"></div>
    <div id="carreira"></div>
    <div id="proximosJogos"></div>
  </div>

  <script>
    const base = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQXGIaXIHqsgswwIsAPgzIkPxXFZAoVb23GdQ4EVMFvUWiJR1c0iMz-lxJBnf3O9p8coIvXrEdhG_dV/pub?gid=";
    const end = "&single=true&output=csv";

    async function carregarDados(gid) {
      const res = await fetch(base + gid + end);
      const texto = await res.text();
      return texto.trim().split("\n").map(l => l.split(","));
    }

    function criarElementoGol(data) {
      const [cab, valores] = data;
      return `
        <h2>Último Gol</h2>
        <p><strong>Data do Gol:</strong> ${valores[0]}</p>
        <p><strong>Time:</strong> ${valores[1]}</p>
        <p><strong>Competição:</strong> ${valores[2]}</p>
        <p><strong>Oponente:</strong> ${valores[3]}</p>
        <p><strong>Gols na Partida:</strong> ${valores[4]}</p>
      `;
    }

    function criarElementoCarreira(data) {
      const [cab, valores] = data;
      return `
        <h2>Carreira</h2>
        <p><strong>Total de Gols:</strong> ${valores[0]}</p>
        <p><strong>Total de Jogos:</strong> ${valores[1]}</p>
      `;
    }

    function criarElementoProximosJogos(data) {
      let html = `<h2>Próximos Jogos</h2>`;
      for (let i = 1; i < data.length; i++) {
        const [adversario, competicao, dataJogo, horario] = data[i];
        html += `
          <div class="jogo">
            <p><strong>Adversário:</strong> ${adversario}</p>
            <p><strong>Competição:</strong> ${competicao}</p>
            <p><strong>Data:</strong> ${dataJogo} - <strong>Horário:</strong> ${horario}</p>
          </div>
        `;
      }
      return html;
    }

    async function montarPagina() {
      const gol = await carregarDados("1986676841");
      const carreira = await carregarDados("1427703403");
      const jogos = await carregarDados("0");

      document.getElementById("ultimoGol").innerHTML = criarElementoGol(gol);
      document.getElementById("carreira").innerHTML = criarElementoCarreira(carreira);
      document.getElementById("proximosJogos").innerHTML = criarElementoProximosJogos(jogos);

      // ⬇️ Envia altura correta após inserir todo o conteúdo
      const height = document.body.scrollHeight;
      window.parent.postMessage({ height: height }, "*");
    }

    montarPagina();
  </script>
</body>
</html>
